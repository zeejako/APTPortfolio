<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Zizile Jako</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.gallery-wrapper{max-width:700px; margin:30px auto; padding:20px; text-align:center;}
.main-card{background:white; border-radius:18px; padding:20px; box-shadow:0 8px 30px rgba(0,0,0,0.12); border:1px solid #eee;}
.main-card img{width:100%; max-height:480px; object-fit:cover; border-radius:14px; border:3px solid #1a237e;}
.message{margin-top:16px; background:#fff9c4; padding:14px 16px; border-radius:12px; border-left:4px solid #ffca28; text-align:left; font-size:15px; line-height:1.5;}
.controls{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
.arrow-btn{width:48px; height:48px; border-radius:50%; border:none; background:#1a237e; color:white; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.arrow-btn:hover{background:#3949ab;}
.counter{font-weight:800; color:#1a237e; background:#e8eaf6; padding:8px 18px; border-radius:20px; letter-spacing:1px;}
.icon-circle{ width:42px; height:42px; border-radius:50%; border:1px solid rgba(0,0,0,0.15); background:white; color:#1a237e; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:18px; }
nav ul{display:flex; align-items:center; gap:14px; list-style:none; flex-wrap:wrap;}
.slide-btn{margin-top:15px; background:#1a237e; color:white; border:none; padding:10px 20px; border-radius:25px; cursor:pointer; font-weight:bold;}
.slide-btn.stop{background:#d32f2f;}
</style>
</head>
<body>
<header style="display:flex; justify-content:space-between; align-items:center; padding:16px 24px;">
<div class="logo"><span style="background:#ffca28; color:#1a237e; width:36px; height:36px; border-radius:50%; display:inline-flex; justify-content:center; align-items:center; font-weight:900; margin-right:8px;">ZJ</span> Zizile Jako</div>
<nav>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About Me</a></li>
<li><a href="family.html">Family</a></li>
<li><a href="hobbies.html">Hobbies</a></li>
<li><a href="gallery.html" class="active">Gallery</a></li>
<li><a href="contact.html">Contact</a></li>
<li><button id="theme-toggle" onclick="toggleMode()" class="icon-circle"><i class="fa-solid fa-moon"></i></button></li>
</ul>
</nav>
</header>

<section>
<h2 style="border-left:4px solid #ffca28; padding-left:10px; margin-left:20px;"><i class="fa-solid fa-images"></i> Image Gallery</h2>

<div class="gallery-wrapper">
  <div class="main-card">
    <img id="gallery-img" src="zizile.jpg" alt="Gallery">
    <div id="gallery-msg" class="message"></div>

    <div class="controls">
      <button class="arrow-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i></button>
      <span class="counter" id="counter">< 1 / 8 ></span>
      <button class="arrow-btn" id="nextBtn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

   
    <button id="slideBtn" class="slide-btn" onclick="toggleSlideshow()"><i class="fa-solid fa-play"></i> Start Slideshow</button>

  </div>
</div>
</section>

<footer><p>Zizile Jako</p></footer>
<script src="js/script.js"></script>
<script>
const items = [
  { img: "zizile.jpg", msg: "<i class='fa-solid fa-graduation-cap'></i> My Graduation Day - A dream come true! This moment marks years of hard work, late nights, and my family's prayers. I made it! - Zizile, 2026" },
  { img: "images/fam.jpg", msg: "<i class='fa-solid fa-people-roof'></i> My Family, My Everything - You are my strength, my love, and my reason to keep pushing." },
  { img: "images/ziphozee.jpg", msg: "<i class='fa-solid fa-heart'></i> ZiphoZee - My Twin, My Mirror, My Other Half. Forever us!" },
  { img: "images/ZEE.jpg", msg: "<i class='fa-solid fa-user'></i> ZEE - Just me being me!" },
  { img: "images/sissy.jpg", msg: "<i class='fa-solid fa-user-group'></i> My Sister - My support system" },
  { img: "images/cuzzy.jpg", msg: "<i class='fa-solid fa-people-group'></i> Cousins Love - Family bond forever" },
  { img: "images/tshezi.jpg", msg: "<i class='fa-solid fa-star'></i> Precious Memories - Unforgettable moments" },
  { img: "images/lovers.jpg", msg: "<i class='fa-solid fa-face-smile'></i> Love & Laughter - Happy times" }
];

let index = 0;
let slideInterval = null;
let isPlaying = false;

const imgEl = document.getElementById('gallery-img');
const msgEl = document.getElementById('gallery-msg');
const counterEl = document.getElementById('counter');
const slideBtn = document.getElementById('slideBtn');

function showItem(){
  imgEl.src = items[index].img;
  msgEl.innerHTML = items[index].msg;
  counterEl.innerHTML = `< ${index+1} / ${items.length} >`;
}

document.getElementById('prevBtn').onclick = () => { index = (index - 1 + items.length) % items.length; showItem(); }
document.getElementById('nextBtn').onclick = () => { index = (index + 1) % items.length; showItem(); }

function toggleSlideshow(){
  if(isPlaying){
    clearInterval(slideInterval);
    isPlaying = false;
    slideBtn.innerHTML = "<i class='fa-solid fa-play'></i> Start Slideshow";
    slideBtn.classList.remove('stop');
  } else {
    isPlaying = true;
    slideBtn.innerHTML = "<i class='fa-solid fa-pause'></i> Stop Slideshow";
    slideBtn.classList.add('stop');
    slideInterval = setInterval(() => {
      index = (index + 1) % items.length;
      showItem();
    }, 2500); 
  }
}

showItem();


const themeIcon = document.querySelector('#theme-toggle i');
const originalToggle = window.toggleMode;
window.toggleMode = function(){
  if(originalToggle) originalToggle();
  const isLight = document.body.classList.contains('light-mode');
  if(themeIcon) themeIcon.className = isLight? 'fa-solid fa-sun' : 'fa-solid fa-moon';
}
</script>
</body>
</html>
